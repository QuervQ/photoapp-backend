services:
  postgres:
    image: postgres:16-alpine
    container_name: photoapp-postgres
    environment:
      POSTGRES_DB: photoapp
      POSTGRES_USER: photoapp
      POSTGRES_PASSWORD: photoapp
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photoapp -d photoapp']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoapp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://photoapp:photoapp@postgres:5432/photoapp}
      JWT_SECRET: ${JWT_SECRET}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-photos}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    ports:
      - '8080:8080'
    volumes:
      - .:/app
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    command: cargo run

volumes:
  postgres-data:
  cargo-target:
  cargo-registry:
